# Controllers of one simulated Yaskawa arm.
# The keys use wildcards so that the same file serves every namespace
# (/yaskawa_LEFT/controller_manager, /yaskawa_RIGHT/controller_manager, ...).
/**/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: forward_command_controller/MultiInterfaceForwardCommandController

/**/arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5

# Gripper requests (GPIO "gripper"): data = [init, open, close], 1 = request set, 0 = released.
# Use scripts/gripper.py, which sends each request as a pulse.
/**/gripper_controller:
  ros__parameters:
    joint: gripper
    interface_names:
      - init
      - open
      - close
