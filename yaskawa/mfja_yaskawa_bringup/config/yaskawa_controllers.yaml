# Controllers of one Yaskawa arm: the SAME file in Gazebo, with mock hardware and on the real arms.
# The wildcard keys serve every namespace (/yaskawa_LEFT, /yaskawa_RIGHT, ...).
#
# Only the clock is not in this file, because it belongs to the hardware: Gazebo forces use_sim_time
# to true; mock and real arms use the wall clock.
#
# arm_controller sends a position and a velocity per joint: the MotoROS2 hardware interface of the
# real arms requires both (each point queued in MotoROS2 carries both, and MotoROS2 uses the
# velocities to interpolate between points). The mock and the Gazebo system
# (mfja_yaskawa_gz_hardware) take the same two commands.
/**/controller_manager:
  ros__parameters:
    update_rate: 50  # Hz, the rate used on the real arms (one MotoROS2 service call per cycle)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: forward_command_controller/MultiInterfaceForwardCommandController

# Local topics (<ns>/joint_state_broadcaster/joint_states): <ns>/joint_states belongs to MotoROS2 on
# the real arms, and to its imitation (mfja_yaskawa_motoros2_sim) in simulation.
/**/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true

/**/arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # A goal is aborted if the arm stops following (servo off, emergency stop, collision).
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      joint_1: {trajectory: 0.2, goal: 0.02}
      joint_2: {trajectory: 0.2, goal: 0.02}
      joint_3: {trajectory: 0.2, goal: 0.02}
      joint_4: {trajectory: 0.2, goal: 0.02}
      joint_5: {trajectory: 0.2, goal: 0.02}
      joint_6: {trajectory: 0.2, goal: 0.02}

# Gripper requests (GPIO "gripper"): data = [init, open, close], 1 = request set, 0 = released.
# Use scripts/gripper.py, which sends each request as a pulse.
/**/gripper_controller:
  ros__parameters:
    joint: gripper
    interface_names:
      - init
      - open
      - close
