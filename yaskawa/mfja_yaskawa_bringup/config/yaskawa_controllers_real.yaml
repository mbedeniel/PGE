# Controllers of one real Yaskawa arm (motoros2_hw_interfaces/MotoROS2HardwareInterface).
# Same controllers as in simulation (config/yaskawa_controllers.yaml), with these differences:
#   - command interfaces position + velocity: required by the MotoROS2 plugin, which sends
#     both to MotoROS2 in every queued point;
#   - joint_state_broadcaster on local topics (<ns>/joint_state_broadcaster/joint_states):
#     MotoROS2 already publishes <ns>/joint_states, and the plugin reads that topic;
#   - path tolerances: a goal is aborted if the arm stops following (servo off, error, stop);
#   - wall-clock time and 50 Hz: one MotoROS2 service call per cycle (see the README).
/**/controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true

/**/arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      joint_1: {trajectory: 0.2, goal: 0.02}
      joint_2: {trajectory: 0.2, goal: 0.02}
      joint_3: {trajectory: 0.2, goal: 0.02}
      joint_4: {trajectory: 0.2, goal: 0.02}
      joint_5: {trajectory: 0.2, goal: 0.02}
      joint_6: {trajectory: 0.2, goal: 0.02}
